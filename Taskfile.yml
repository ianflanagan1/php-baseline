version: '3'

tasks:
  setup:
    desc: Install dependencies from the lockfile
    cmds:
      - 'composer install --no-interaction'

  check:
    desc: composer.json, the tests (which include the conformance tests), PHPStan, deptrac and Pint
    cmds:
      - 'composer validate --strict'
      - 'vendor/bin/phpunit --colors=never'
      - 'vendor/bin/phpstan analyse --no-progress'
      - 'vendor/bin/deptrac analyse --no-progress'
      - 'vendor/bin/pint --test'

  format:
    desc: Format every file
    cmds:
      - 'vendor/bin/pint'

  lint-file:
    desc: 'Format and analyse the PHP files given after --, leaving other files alone: task lint-file -- <file>...'
    vars:
      PHP_FILES: '{{range .CLI_ARGS_LIST}}{{if or (hasSuffix ".php" .) (hasPrefix "bin/" .)}}{{shellQuote .}} {{end}}{{end}}'
    cmds:
      - '{{if .PHP_FILES}}vendor/bin/pint {{.PHP_FILES}} && vendor/bin/phpstan analyse --no-progress {{.PHP_FILES}}{{end}}'

  rulebook-coverage:
    desc: Write rulebook-coverage.json, how php-baseline enforces the architecture rulebook, for the rulebook to import
    cmds:
      - 'php bin/php-baseline rulebook > rulebook-coverage.json'
